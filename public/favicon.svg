<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160920"/>
      <stop offset="100%" stop-color="#09030e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae17d"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Thin Elegant Frame -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.25"/>

  <!-- Perfectly Centered Modern Monogram -->
  <g>
    <!-- 'A' Left Diagonal -->
    <path d="M 141 345 L 201 165" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- 'A' Right Diagonal -->
    <path d="M 201 165 L 271 345" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- 'A' Crossbar -->
    <path d="M 159 275 L 243 275" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>

    <!-- 'D' Modern Curve & Stem -->
    <path d="M 231 165 L 291 165 C 346 165, 371 205, 371 255 C 371 305, 346 345, 291 345 L 231 345" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
